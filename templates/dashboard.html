{% extends base_template %}
{% block content %}
<h2>📊 Monitoring Dashboard</h2>
<meta name="csrf-token" content="{{ csrf_token() }}">
<div class="stats-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:20px; margin-bottom:32px;">
    <div class="stat-card" style="background: linear-gradient(135deg, rgba(16, 185, 129, 0.08), rgba(16, 185, 129, 0.02)); border: 1px solid rgba(16, 185, 129, 0.2); padding: 24px; border-radius: 16px; text-align: center; position: relative; overflow: hidden; transition: all 0.3s;">
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent-green), transparent);"></div>
        <div style="font-size: 2rem; margin-bottom: 8px;">🧠</div>
        <h3 style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 8px;">Active Tasks</h3>
        <p id="activeTasks" style="font-size: 2.5rem; font-weight: 800; color: var(--accent-green); text-shadow: 0 0 20px rgba(16, 185, 129, 0.3);">0</p>
    </div>
    <div class="stat-card" style="background: linear-gradient(135deg, rgba(245, 158, 11, 0.08), rgba(245, 158, 11, 0.02)); border: 1px solid rgba(245, 158, 11, 0.2); padding: 24px; border-radius: 16px; text-align: center; position: relative; overflow: hidden; transition: all 0.3s;">
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent-amber), transparent);"></div>
        <div style="font-size: 2rem; margin-bottom: 8px;">⏳</div>
        <h3 style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 8px;">Queue Size</h3>
        <p id="queueSize" style="font-size: 2.5rem; font-weight: 800; color: var(--accent-amber); text-shadow: 0 0 20px rgba(245, 158, 11, 0.3);">0</p>
    </div>
    <div class="stat-card" style="background: linear-gradient(135deg, rgba(6, 182, 212, 0.08), rgba(6, 182, 212, 0.02)); border: 1px solid rgba(6, 182, 212, 0.2); padding: 24px; border-radius: 16px; text-align: center; position: relative; overflow: hidden; transition: all 0.3s;">
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);"></div>
        <div style="font-size: 2rem; margin-bottom: 8px;">📦</div>
        <h3 style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 8px;">Total Tasks</h3>
        <p id="totalTasks" style="font-size: 2.5rem; font-weight: 800; color: var(--accent-cyan); text-shadow: 0 0 20px rgba(6, 182, 212, 0.3);">0</p>
    </div>
    <div class="stat-card" style="background: linear-gradient(135deg, rgba(139, 92, 246, 0.08), rgba(139, 92, 246, 0.02)); border: 1px solid rgba(139, 92, 246, 0.2); padding: 24px; border-radius: 16px; text-align: center; position: relative; overflow: hidden; transition: all 0.3s;">
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent-purple), transparent);"></div>
        <div style="font-size: 2rem; margin-bottom: 8px;">⚙️</div>
        <h3 style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 8px;">Max Workers</h3>
        <p id="maxWorkers" style="font-size: 2.5rem; font-weight: 800; color: var(--accent-purple); text-shadow: 0 0 20px rgba(139, 92, 246, 0.3);">0</p>
    </div>
</div>

<h3 style="margin-bottom: 16px; display: flex; align-items: center; gap: 10px;">
    <span style="width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 10px var(--accent-green); display: inline-block;"></span>
    🏃 Running Tasks
</h3>
<div id="taskList" class="card" style="padding: 0; overflow: hidden;">
    <p style="color: var(--text-muted); padding: 40px; text-align: center;">Loading tasks...</p>
</div>
<th style="padding: 16px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); border-bottom: 1px solid var(--border-subtle);">Tokens</th>
<div class="stat-card" style="background: linear-gradient(135deg, rgba(236, 72, 153, 0.08), rgba(236, 72, 153, 0.02)); border: 1px solid rgba(236, 72, 153, 0.2); padding: 24px; border-radius: 16px; text-align: center; position: relative; overflow: hidden; transition: all 0.3s;">
    <div style="position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent-pink), transparent);"></div>
    <div style="font-size: 2rem; margin-bottom: 8px;">🔢</div>
    <h3 style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 8px;">Total Tokens</h3>
    <p id="totalTokens" style="font-size: 2.5rem; font-weight: 800; color: var(--accent-pink); text-shadow: 0 0 20px rgba(236, 72, 153, 0.3);">0</p>
</div>

<script>
    async function fetchStatus() {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();
            animateValue('activeTasks', parseInt(document.getElementById('activeTasks').textContent), data.active_tasks, 500);
            animateValue('queueSize', parseInt(document.getElementById('queueSize').textContent), data.queue_size, 500);
            animateValue('totalTasks', parseInt(document.getElementById('totalTasks').textContent), data.total_tasks, 500);
            animateValue('maxWorkers', parseInt(document.getElementById('maxWorkers').textContent), data.max_workers, 500);
        } catch (e) {
            console.warn('Status fetch failed', e);
        }
    }
    
    async function fetchUserTokens() {
        try {
            const res = await fetch('/api/user/tokens');
            const data = await res.json();
            document.getElementById('totalTokens').textContent = data.total_tokens || 0;
        } catch (e) {}
    }
    
    function animateValue(id, start, end, duration) {
        if (start === end) return;
        const obj = document.getElementById(id);
        const range = end - start;
        const minTimer = 50;
        let stepTime = Math.abs(Math.floor(duration / range));
        stepTime = Math.max(stepTime, minTimer);
        let startTime = new Date().getTime();
        let endTime = startTime + duration;
        let timer;
        function run() {
            let now = new Date().getTime();
            let remaining = Math.max((endTime - now) / duration, 0);
            let value = Math.round(end - (remaining * range));
            obj.textContent = value;
            if (value == end) clearInterval(timer);
        }
        timer = setInterval(run, stepTime);
        run();
    }

    async function fetchRunningTasks() {
        try {
            const res = await fetch('/api/running_tasks');
            const tasks = await res.json();
            const container = document.getElementById('taskList');
            if (!tasks.length) {
                container.innerHTML = '<p style="color: var(--text-muted); padding: 40px; text-align: center;">✨ No running or pending tasks</p>';
                return;
            }
            let html = '<table style="width:100%; border-collapse: separate; border-spacing: 0;">';
            html += `<td style="padding: 14px 16px; color: var(--text-secondary); font-size: 0.9rem;">${t.tokens_used || 0}</td>`;
            html += `<thead><tr style="background: rgba(0,0,0,0.2);">
                <th style="padding: 16px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); border-bottom: 1px solid var(--border-subtle);">ID</th>
                <th style="padding: 16px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); border-bottom: 1px solid var(--border-subtle);">Status</th>
                <th style="padding: 16px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); border-bottom: 1px solid var(--border-subtle);">Workspace</th>
                <th style="padding: 16px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); border-bottom: 1px solid var(--border-subtle);">Provider</th>
                <th style="padding: 16px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); border-bottom: 1px solid var(--border-subtle);">Action</th>
            </tr></thead><tbody>`;
            tasks.forEach(t => {
                const statusColor = t.status === 'running' ? 'var(--accent-green)' : t.status === 'pending' ? 'var(--accent-amber)' : 'var(--accent-red)';
                const statusGlow = t.status === 'running' ? 'rgba(16, 185, 129, 0.3)' : t.status === 'pending' ? 'rgba(245, 158, 11, 0.3)' : 'rgba(244, 63, 94, 0.3)';
                html += `<tr style="border-bottom: 1px solid rgba(255,255,255,0.03); transition: all 0.2s;" onmouseover="this.style.background='var(--bg-hover)'" onmouseout="this.style.background='transparent'">
                    <td style="padding: 14px 16px;"><code style="font-size: 0.8rem; padding: 4px 8px; background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.15); border-radius: 6px; color: var(--accent-cyan);">${t.id.slice(0,8)}</code></td>
                    <td style="padding: 14px 16px;"><span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; background: ${statusGlow}; color: ${statusColor}; font-size: 0.8rem; font-weight: 600; border: 1px solid ${statusGlow};"><span style="width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor;"></span>${t.status}</span></td>
                    <td style="padding: 14px 16px; color: var(--text-secondary); font-size: 0.9rem;">${t.workspace || 'default'}</td>
                    <td style="padding: 14px 16px; color: var(--text-secondary); font-size: 0.9rem;">${t.provider || 'unknown'}</td>
                    <td style="padding: 14px 16px;">
                        <button onclick="cancelTask('${t.id}')" style="background: linear-gradient(135deg, rgba(244, 63, 94, 0.15), rgba(244, 63, 94, 0.05)); border: 1px solid rgba(244, 63, 94, 0.3); color: var(--accent-red); padding: 6px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.8rem; transition: all 0.2s;">Cancel</button>
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        } catch (e) {
            console.warn('Running tasks fetch failed', e);
        }
    }

    async function cancelTask(taskId) {
        if (!confirm('Cancel this task?')) return;
        try {
            const res = await fetch(`/api/task/${taskId}/cancel`, { method: 'POST' });
            const data = await res.json();
            alert(data.status || data.message || 'Cancelled');
            fetchRunningTasks();
            fetchStatus();
        } catch (e) {
            alert('Error cancelling task: ' + e.message);
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        fetchStatus();
        fetchRunningTasks();
        fetchUserToken();
        setInterval(() => {
            fetchStatus();
            fetchRunningTasks();
        }, 3000);
    });
</script>
{% endblock %}
