steps:
  - tool: nmap
    arguments:
      target: "{target}"
      scan_type: "-sV"
      ports: "80,443"
      additional_args: "-T4"

  - tool: wpscan
    arguments:
      url: "http://{target}"
      additional_args: "--enumerate vp,vt,tt,cb,dbe,u,m"

  - tool: gobuster
    arguments:
      url: "http://{target}"
      mode: "dir"
      wordlist: "/usr/share/seclists/Discovery/Web-Content/CMS/wordpress.fuzz.txt"
      additional_args: "-t 50 -x php,txt,html"

  - tool: nikto
    arguments:
      target: "{target}"
      additional_args: "-ssl"
