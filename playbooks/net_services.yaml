steps:
  - tool: nmap
    arguments:
      target: "{target}"
      scan_type: "-sV -sC"
      ports: ""
      additional_args: "-T4 -p-"

  - tool: enum4linux
    arguments:
      target: "{target}"
      additional_args: "-a"

  - tool: hydra
    arguments:
      target: "{target}"
      service: "ssh"
      userlist: "/usr/share/seclists/Usernames/top-usernames-shortlist.txt"
      passlist: "/usr/share/seclists/Passwords/Common-Credentials/10k-most-common.txt"
      additional_args: "-t 4"

  - tool: hydra
    arguments:
      target: "{target}"
      service: "ftp"
      userlist: "/usr/share/seclists/Usernames/top-usernames-shortlist.txt"
      passlist: "/usr/share/seclists/Passwords/Common-Credentials/10k-most-common.txt"
      additional_args: "-t 4"

  - tool: netcat
    arguments:
      target: "{target}"
      ports: "21,22,23,25,80,443,3306,3389"
      additional_args: "-v -w 2"
