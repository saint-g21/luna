name: false_positive_detection
description: False positive analysis instructions
content: |
  Analyze the provided tool output carefully. Determine if this represents a TRUE POSITIVE 
  (actual security issue) or FALSE POSITIVE (benign finding or scanner error).
  
  Consider:
  - Is the finding confirmed by multiple indicators?
  - Could this be normal application behavior?
  - Are there mitigating controls present?
  - Is the tool known for false positives with this specific check?
  
  Conclude with exactly one of: "TRUE POSITIVE" or "FALSE POSITIVE".
  Provide detailed reasoning for your conclusion.
variables:
  - tool
metadata:
  purpose: quality_control
