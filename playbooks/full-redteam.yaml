steps:
  - tool: nmap
    arguments:
      target: "{target}"
      scan_type: "-sn"
      ports: ""
      additional_args: "-PE -PP"
    description: "PHASE 1: Host discovery via ICMP echo and timestamp"

  - tool: nmap
    arguments:
      target: "{target}"
      scan_type: "-sS"
      ports: ""
      additional_args: "-T4 -p- --min-rate 1000"
    description: "Full TCP port sweep across all 65535 ports"

  - tool: nmap
    arguments:
      target: "{target}"
      scan_type: "-sU"
      ports: "53,67,68,69,123,137,138,139,161,162,445,500,514,520,631,1434,1900"
      additional_args: "-T4 --max-retries 2"
    description: "UDP service enumeration on common ports"

  - tool: nmap
    arguments:
      target: "{target}"
      scan_type: "-sV"
      ports: ""
      additional_args: "-T4 --version-intensity 9"
    description: "PHASE 2: Aggressive service version detection"

  - tool: nmap
    arguments:
      target: "{target}"
      scan_type: "-sC"
      ports: ""
      additional_args: "-T4"
    description: "Default NSE script scan for automated enumeration"

  - tool: nmap
    arguments:
      target: "{target}"
      scan_type: "-O"
      ports: ""
      additional_args: "-T4 --osscan-guess"
    description: "Operating system fingerprinting"

  - tool: netcat
    arguments:
      target: "{target}"
      port: "21,22,23,25,80,110,143,443,445,993,995,3306,3389,5432,5900,8080"
      mode: "banner"
      additional_args: "-v -w 2"
    description: "Banner grabbing on all common services"

  - tool: enum4linux
    arguments:
      target: "{target}"
      additional_args: "-a"
    description: "PHASE 3: Full SMB/AD enumeration"

  - tool: enum4linux
    arguments:
      target: "{target}"
      additional_args: "-u '' -p '' -P"
    description: "Null session test for anonymous access"

  - tool: nmap
    arguments:
      target: "{target}"
      scan_type: "--script smb-security-mode,smb-protocols"
      ports: "445"
      additional_args: "-T4"
    description: "SMB security configuration audit"

  - tool: nmap
    arguments:
      target: "{target}"
      scan_type: "-sV"
      ports: "80,443,8080,8443,3000,4000,5000,8000,9000"
      additional_args: "-T4 --script=http-title,http-methods"
    description: "PHASE 4: Web service discovery and enumeration"

  - tool: curl
    arguments:
      url: "http://{target}/"
      additional_args: "-I -s -L --max-time 15"
    description: "HTTP header and redirect analysis"

  - tool: gobuster
    arguments:
      url: "http://{target}"
      mode: "dir"
      wordlist: "/usr/share/seclists/Discovery/Web-Content/common.txt"
      additional_args: "-t 50 -x php,html,txt,bak,old,zip,sql,js,json,xml"
    description: "Directory and file enumeration"

  - tool: gobuster
    arguments:
      url: "http://{target}"
      mode: "dns"
      wordlist: "/usr/share/seclists/Discovery/DNS/subdomains-top1million-5000.txt"
      additional_args: "-t 50"
    description: "Subdomain enumeration"

  - tool: nikto
    arguments:
      target: "{target}"
      additional_args: "-ssl -C all -Tuning 1234567890"
    description: "Comprehensive web vulnerability scan"

  - tool: wpscan
    arguments:
      url: "http://{target}"
      additional_args: "--enumerate vp,vt,tt,cb,dbe,u,m --plugins-detection aggressive"
    description: "WordPress deep enumeration"

  - tool: curl
    arguments:
      url: "http://{target}/.env"
      additional_args: "-s --max-time 10"
    description: "Exposed environment file check"

  - tool: curl
    arguments:
      url: "http://{target}/robots.txt"
      additional_args: "-s --max-time 10"
    description: "Robots.txt analysis for hidden paths"

  - tool: sqlmap
    arguments:
      target: "http://{target}/"
      mode: "crawl"
      additional_args: "--crawl=3 --batch --random-agent --level=2 --risk=1"
    description: "PHASE 5: Automated SQL injection discovery via crawling"

  - tool: sqlmap
    arguments:
      target: "http://{target}/"
      mode: "forms"
      additional_args: "--forms --batch --random-agent --level=2 --risk=1"
    description: "Form-based SQL injection testing"

  - tool: nmap
    arguments:
      target: "{target}"
      scan_type: "-sV"
      ports: "1433,1521,27017,3306,5432,6379,9200"
      additional_args: "-T4"
    description: "Database service version detection"

  - tool: curl
    arguments:
      url: "http://{target}:9200/_cluster/health"
      additional_args: "-s --max-time 10"
    description: "Elasticsearch unauthenticated access check"

  - tool: hydra
    arguments:
      target: "{target}"
      service: "ssh"
      port: "22"
      wordlist_user: "/usr/share/seclists/Usernames/top-usernames-shortlist.txt"
      wordlist_pass: "/usr/share/seclists/Passwords/darkweb2017-top100.txt"
      additional_args: "-t 6 -V"
    description: "PHASE 6: SSH brute force"

  - tool: hydra
    arguments:
      target: "{target}"
      service: "ftp"
      port: "21"
      wordlist_user: "/usr/share/seclists/Usernames/top-usernames-shortlist.txt"
      wordlist_pass: "/usr/share/seclists/Passwords/darkweb2017-top100.txt"
      additional_args: "-t 6 -V"
    description: "FTP brute force"

  - tool: hydra
    arguments:
      target: "{target}"
      service: "smb"
      port: "445"
      wordlist_user: "/usr/share/seclists/Usernames/top-usernames-shortlist.txt"
      wordlist_pass: "/usr/share/seclists/Passwords/darkweb2017-top100.txt"
      additional_args: "-t 4 -V"
    description: "SMB brute force"

  - tool: hydra
    arguments:
      target: "{target}"
      service: "http-post-form"
      port: "80"
      wordlist_user: "/usr/share/seclists/Usernames/top-usernames-shortlist.txt"
      wordlist_pass: "/usr/share/seclists/Passwords/darkweb2017-top100.txt"
      additional_args: '"/login.php:username=^USER^&password=^PASS^:Invalid" -V'
    description: "Web form brute force"

  - tool: hydra
    arguments:
      target: "{target}"
      service: "rdp"
      port: "3389"
      wordlist_user: "/usr/share/seclists/Usernames/top-usernames-shortlist.txt"
      wordlist_pass: "/usr/share/seclists/Passwords/darkweb2017-top100.txt"
      additional_args: "-t 4 -V"
    description: "RDP brute force"

  - tool: hydra
    arguments:
      target: "{target}"
      service: "mysql"
      port: "3306"
      wordlist_user: "/usr/share/seclists/Usernames/top-usernames-shortlist.txt"
      wordlist_pass: "/usr/share/seclists/Passwords/darkweb2017-top100.txt"
      additional_args: "-t 6 -V"
    description: "MySQL brute force"

  - tool: nmap
    arguments:
      target: "{target}"
      scan_type: "--script vuln"
      ports: ""
      additional_args: "-T4"
    description: "PHASE 7: NSE vulnerability script validation"

  - tool: nmap
    arguments:
      target: "{target}"
      scan_type: "--script ssh-audit"
      ports: "22"
      additional_args: "-T4"
    description: "SSH cryptographic configuration audit"
