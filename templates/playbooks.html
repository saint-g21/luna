{% extends base_template %}
{% block content %}
<h2>📚 Playbooks</h2>
<meta name="csrf-token" content="{{ csrf_token() }}">
<div class="card" style="margin-bottom: 24px;">
    <h3 style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
        <span style="width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan)); border-radius: 10px; display: flex; align-items: center; justify-content: center;">✨</span>
        Create New Playbook
    </h3>
    <div style="display: flex; flex-direction: column; gap: 12px;">
        <input type="text" id="playbookName" placeholder="Playbook Name" style="max-width: 400px;">
        <textarea id="playbookYaml" rows="6" placeholder='steps:\n  - tool: nmap_scan\n    arguments:\n      target: "{target}"\n      scan_type: "-sV"' style="font-family: var(--font-mono); font-size: 0.85rem;"></textarea>
        <button id="createBtn" style="max-width: 200px; background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan)); color: white; border: none;">Create Playbook</button>
    </div>
</div>

<div id="streamOutput" class="card" style="display:none; background: rgba(0,0,0,0.4); padding: 16px; border: 1px solid var(--border-subtle); border-radius: 12px; max-height: 300px; overflow-y: auto; font-family: var(--font-mono); font-size: 0.85rem; white-space: pre-wrap; color: var(--text-secondary);">
</div>

<div id="playbooksList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px;"></div>

<script>
    // ----- CSRF helper (fallback) -----
    if (typeof fetchWithCSRF === 'undefined') {
        window.fetchWithCSRF = function(url, options = {}) {
            const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
            options.headers = {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken,
                ...(options.headers || {})
            };
            options.credentials = 'include';
            return fetch(url, options);
        };
    }

    // ----- Load playbooks -----
    async function loadPlaybooks() {
        try {
            const res = await fetchWithCSRF('/api/playbooks');
            const playbooks = await res.json();
            const container = document.getElementById('playbooksList');
            container.innerHTML = '';
            for (const pb of playbooks) {
                const div = document.createElement('div');
                div.className = 'card';
                div.style.cssText = 'display: flex; flex-direction: column; gap: 12px;';
                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h3 style="margin: 0; color: var(--accent-cyan); font-size: 1.1rem;">${escapeHtml(pb.name)}</h3>
                        <span style="font-size: 0.75rem; color: var(--text-muted); background: rgba(6, 182, 212, 0.1); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(6, 182, 212, 0.15);">${pb.content.steps ? pb.content.steps.length : 0} steps</span>
                    </div>
                    <pre style="margin: 0; font-size: 0.75rem; max-height: 120px; overflow: auto;">${JSON.stringify(pb.content, null, 2)}</pre>
                    <div style="display: flex; gap: 10px; margin-top: auto;">
                        <button class="runBtn" data-name="${pb.name}" style="flex: 1; margin: 0; background: linear-gradient(135deg, var(--accent-green), rgba(16, 185, 129, 0.8)); color: white; border: none;">▶ Run</button>
                        <button class="deleteBtn" data-name="${pb.name}" style="margin: 0; background: rgba(244, 63, 94, 0.1); border-color: rgba(244, 63, 94, 0.2); color: var(--accent-red);">🗑 Delete</button>
                    </div>
                    <div id="output-${pb.name}" style="display: none; margin-top: 8px;"></div>
                `;
                container.appendChild(div);
            }
            // Attach event listeners
            document.querySelectorAll('.runBtn').forEach(btn => {
                btn.onclick = () => runPlaybook(btn.dataset.name);
            });
            document.querySelectorAll('.deleteBtn').forEach(btn => {
                btn.onclick = async () => {
                    await fetchWithCSRF(`/api/playbooks/${btn.dataset.name}`, { method: 'DELETE' });
                    loadPlaybooks();
                };
            });
        } catch (err) {
            document.getElementById('playbooksList').innerHTML = `<div class="card" style="color: var(--accent-red); grid-column: 1 / -1;">Error loading playbooks: ${escapeHtml(err.message)}</div>`;
        }
    }

    // ----- Run playbook using the MCP Router -----
    async function runPlaybook(name) {
        const res = await fetchWithCSRF(`/api/playbooks`);
        const playbooks = await res.json();
        const pb = playbooks.find(p => p.name === name);
        if (!pb) return;
        const steps = pb.content.steps || [];
        const finalDiv = document.getElementById(`output-${name}`);
        if (finalDiv) {
            finalDiv.style.display = 'block';
            finalDiv.innerHTML = '';
        }

        const globalTarget = localStorage.getItem('globalTarget') || '';

        for (let i = 0; i < steps.length; i++) {
            let step = steps[i];
            let args = { ...step.arguments };
            // Replace {target} placeholder
            for (const [key, value] of Object.entries(args)) {
                if (typeof value === 'string') args[key] = value.replace(/\{target\}/g, globalTarget);
            }
            if (args.target === undefined && globalTarget) args.target = globalTarget;

            const stepDiv = document.createElement('div');
            stepDiv.style.cssText = 'margin-bottom: 16px; padding: 16px; background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px solid var(--border-subtle);';
            stepDiv.innerHTML = `<div style="font-weight: 600; color: var(--accent-cyan); margin-bottom: 8px; font-size: 0.9rem;">Step ${i+1}: ${step.tool}</div><code style="font-size: 0.8rem;">${JSON.stringify(args)}</code><br>`;

            try {
                // Call the router directly
                const response = await fetchWithCSRF('/router/call', {
                    method: 'POST',
                    body: JSON.stringify({ tool: step.tool, arguments: args })
                });
                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errText}`);
                }
                const result = await response.json();
                const rawJson = JSON.stringify(result, null, 2);
                const formatted = formatJsonToText(result);
                stepDiv.innerHTML += `
                    <details style="margin-top: 12px;"><summary style="color: var(--accent-green); font-weight: 600; font-size: 0.85rem; cursor: pointer;">Result (Raw JSON)</summary>
                    <pre style="margin-top: 8px; font-size: 0.75rem;">${escapeHtml(rawJson)}</pre></details>
                `;
                if (formatted !== rawJson) {
                    stepDiv.innerHTML += `
                        <details style="margin-top: 8px;"><summary style="color: var(--accent-purple); font-weight: 600; font-size: 0.85rem; cursor: pointer;">Result (Formatted)</summary>
                        <pre style="margin-top: 8px; font-size: 0.75rem; white-space: pre-wrap;">${escapeHtml(formatted)}</pre></details>
                    `;
                }
            } catch (err) {
                stepDiv.innerHTML += `<div style="color: var(--accent-red); margin-top: 8px; font-size: 0.85rem;">❌ ${escapeHtml(err.message)}</div>`;
            }
            finalDiv.appendChild(stepDiv);
        }

        const done = document.createElement('div');
        done.style.cssText = 'text-align: center; padding: 12px; color: var(--accent-green); font-weight: 600; background: rgba(16, 185, 129, 0.05); border-radius: 10px; border: 1px solid rgba(16, 185, 129, 0.15);';
        done.textContent = '✅ Playbook completed';
        finalDiv.appendChild(done);
    }

    // ----- Helpers -----
    function escapeHtml(text) {
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    function formatJsonToText(data) {
        if (data === null || data === undefined) return 'No data';
        if (typeof data === 'string') return data;
        if (typeof data === 'number' || typeof data === 'boolean') return String(data);
        if (Array.isArray(data)) {
            return data.map((item, idx) => `[${idx}] ${formatJsonToText(item)}`).join('\n');
        }
        if (typeof data === 'object') {
            let lines = [];
            for (const [key, value] of Object.entries(data)) {
                if (value && typeof value === 'object') {
                    lines.push(`${key}:`);
                    lines.push(formatJsonToText(value).split('\n').map(line => '  ' + line).join('\n'));
                } else {
                    lines.push(`${key}: ${value}`);
                }
            }
            return lines.join('\n');
        }
        return String(data);
    }

    // ----- Create playbook -----
    document.getElementById('createBtn').onclick = async () => {
        const name = document.getElementById('playbookName').value;
        const content = document.getElementById('playbookYaml').value;
        await fetchWithCSRF('/api/playbooks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, content })
        });
        loadPlaybooks();
    };

    // ----- Init -----
    document.addEventListener('DOMContentLoaded', loadPlaybooks);
</script>
{% endblock %}
