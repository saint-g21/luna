{% extends base_template %}
{% block content %}
<h2>📝 Session Memory</h2>
<meta name="csrf-token" content="{{ csrf_token() }}">
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="margin: 0; display: flex; align-items: center; gap: 10px;">
            <span style="width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); border-radius: 10px; display: flex; align-items: center; justify-content: center;">🧠</span>
            Active Session State
        </h3>
        <button id="refreshBtn" style="margin: 0; background: rgba(6, 182, 212, 0.1); border-color: rgba(6, 182, 212, 0.2); color: var(--accent-cyan);">🔄 Refresh</button>
    </div>
    <div id="sessionData" style="background: rgba(0,0,0,0.3); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 24px; white-space: pre-wrap; font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-secondary); line-height: 1.7;">
        <div style="text-align: center; padding: 40px; color: var(--text-muted);">
            <div style="font-size: 2rem; margin-bottom: 12px;">⏳</div>
            Connecting to MCP proxy...
        </div>
    </div>
</div>

<script>
    const PROXY_URL = "/mcp";
    let messageEndpoint = null;
    let eventSource = null;
    const pendingRequests = {};

    function connectSSE() {
        if (eventSource) eventSource.close();
        eventSource = new EventSource(PROXY_URL + '/sse');
        eventSource.addEventListener('endpoint', (e) => {
            messageEndpoint = e.data;
            fetchSessionState();
        });
        eventSource.onerror = () => console.error('SSE error');
        eventSource.addEventListener('message', (e) => {
            try {
                const msg = JSON.parse(e.data);
                if (msg.id && pendingRequests[msg.id]) {
                    pendingRequests[msg.id](msg);
                    delete pendingRequests[msg.id];
                }
            } catch (err) {}
        });
    }

    async function sendMCPRequest(method, params) {
        if (!messageEndpoint) throw new Error('No endpoint');
        const id = Math.random().toString(36).substring(2);
        const request = { jsonrpc: "2.0", id, method, params };
        const url = PROXY_URL + messageEndpoint;
        const response = await fetchWithCSRF(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(request)
        });
        if (!response.ok) {
            let errorMsg = `HTTP ${response.status}`;
            try {
                const errData = await response.json();
                if (errData.error) errorMsg = errData.error;
                if (errData.detail) errorMsg = errData.detail;
            } catch (e) {}
            throw new Error(errorMsg);
        }
        return new Promise((resolve, reject) => {
            pendingRequests[id] = (msg) => {
                if (msg.error) reject(new Error(msg.error.message));
                else resolve(msg.result);
            };
            setTimeout(() => {
                if (pendingRequests[id]) {
                    delete pendingRequests[id];
                    reject(new Error('Timeout (1m)'));
                }
            }, 60000);
        });
    }

    async function fetchSessionState() {
        if (!messageEndpoint) {
            document.getElementById('sessionData').innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-muted);"><div style="font-size: 2rem; margin-bottom: 12px;">🔗</div>Connecting...</div>';
            return;
        }
        try {
            const result = await sendMCPRequest("tools/call", { name: "get_session_state", arguments: {} });
            const data = result || {};
            const commands = data.executed_commands || [];
            const count = commands.length;
            const phase = data.current_phase || 'N/A';
            const sessionId = data.session_id || 'N/A';
            
            let html = `<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px;">`;
            html += `<div style="padding: 16px; background: rgba(6, 182, 212, 0.05); border: 1px solid rgba(6, 182, 212, 0.15); border-radius: 12px;">
                <div style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 4px;">Session ID</div>
                <div style="color: var(--accent-cyan); font-weight: 600;">${sessionId}</div>
            </div>`;
            html += `<div style="padding: 16px; background: rgba(139, 92, 246, 0.05); border: 1px solid rgba(139, 92, 246, 0.15); border-radius: 12px;">
                <div style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 4px;">Current Phase</div>
                <div style="color: var(--accent-purple); font-weight: 600;">${phase}</div>
            </div>`;
            html += `<div style="padding: 16px; background: rgba(16, 185, 129, 0.05); border: 1px solid rgba(16, 185, 129, 0.15); border-radius: 12px;">
                <div style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 4px;">Commands Executed</div>
                <div style="color: var(--accent-green); font-weight: 600; font-size: 1.25rem;">${count}</div>
            </div>`;
            html += `</div>`;
            
            if (commands.length > 0) {
                html += `<div style="margin-bottom: 16px;"><div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 12px; font-weight: 600;">Recent Commands</div>`;
                commands.slice(-5).forEach((cmd, i) => {
                    html += `<div style="padding: 10px 14px; background: rgba(0,0,0,0.2); border-radius: 8px; margin-bottom: 6px; border-left: 3px solid var(--accent-cyan);">
                        <span style="color: var(--accent-cyan); font-weight: 600; font-size: 0.8rem;">#${count - 4 + i}</span>
                        <span style="color: var(--text-secondary); margin-left: 8px;">${cmd.tool}:</span>
                        <code style="margin-left: 8px; font-size: 0.75rem;">${cmd.command.substring(0, 60)}${cmd.command.length > 60 ? '...' : ''}</code>
                    </div>`;
                });
                if (commands.length > 5) html += `<div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 8px;">... and ${commands.length - 5} more</div>`;
                html += `</div>`;
            } else {
                html += `<div style="text-align: center; padding: 20px; color: var(--text-muted);">No commands executed yet.</div>`;
            }
            
            html += `<details style="margin-top: 20px;"><summary style="font-weight: 600; color: var(--accent-cyan); cursor: pointer; font-size: 0.9rem;">Full Details (JSON)</summary>
            <pre style="margin-top: 12px; font-size: 0.75rem; max-height: 400px; overflow: auto;">${JSON.stringify(data, null, 2)}</pre></details>`;
            
            document.getElementById('sessionData').innerHTML = html;
        } catch (err) {
            document.getElementById('sessionData').innerHTML = `<div style="color: var(--accent-red); text-align: center; padding: 40px;">❌ Error: ${err.message}</div>`;
        }
    }

    document.getElementById('refreshBtn').onclick = fetchSessionState;
    connectSSE();
</script>
{% endblock %}
